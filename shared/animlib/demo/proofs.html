<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Four worlds · 3D proofs</title>
<style>
*{box-sizing:border-box}:root{color-scheme:dark;font:14px/1.5 system-ui,sans-serif;color:#eee;background:#101111}body{margin:0}main{max-width:1600px;margin:auto;padding:26px 32px}header{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid #303332;padding-bottom:18px}.brand{font-size:21px;letter-spacing:-.6px;font-weight:650}.subtle{font-size:12px;color:#9ba5a0}nav{display:flex;gap:8px;padding:20px 0;flex-wrap:wrap}button,select{font:inherit;color:inherit}button{background:#181c1a;border:1px solid #343c38;border-radius:7px;padding:9px 14px;cursor:pointer}button:hover{background:#26312b}button[aria-pressed=true]{background:#24362e;border-color:#6f9a82}button:focus-visible,input:focus-visible{outline:2px solid #9cdceb;outline-offset:3px}button:disabled{opacity:.45;cursor:wait}.layout{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:28px;align-items:start}.stage{background:#000;border:1px solid #2b302d;border-radius:10px;overflow:hidden;min-width:0}#canvas-host{aspect-ratio:16/10;width:100%}canvas{width:100%;height:100%;display:block;touch-action:none}.transport{display:flex;gap:10px;align-items:center;padding:12px;border-top:1px solid #252a27}.transport button{font-size:12px;padding:6px 10px}#seek{min-width:50px;flex:1;accent-color:#91bda3}#clock{font:11px ui-monospace,monospace;white-space:nowrap;min-width:78px}.orbit-note{padding:0 14px 12px;color:#87958c;font-size:11px}.kicker{text-transform:uppercase;letter-spacing:.12em;color:#9ba99f;font-size:10px;margin:8px 0 18px}h1{font:500 33px/1.12 system-ui,sans-serif;letter-spacing:-1.2px;margin:0 0 17px}#description{color:#adb8b0;font-size:13px}#controls{margin-top:22px}#controls .animlib-controls{position:static!important;inset:auto!important;padding:0!important;gap:18px!important;width:auto!important;height:auto!important;align-items:stretch!important;--animlib-control-accent:#aad6ba}#controls .animlib-control{width:100%!important}details{margin-top:24px;border-top:1px solid #303732;padding-top:14px}summary{cursor:pointer;color:#b9c7be;font-size:12px}#notes{padding-left:16px;color:#8f9f94;font-size:11px}#notes li{margin-bottom:12px}#source-link{color:#aad6ba;font-size:12px}#status{margin-top:18px;font-size:11px;color:#85998d}#error{white-space:pre-wrap;color:#ffaaaa;background:#301c1c;border:1px solid #925151;padding:12px;border-radius:6px}footer{color:#718579;font-size:11px;padding-top:18px}a{color:#a3cbbb}[hidden]{display:none!important}@media(max-width:900px){main{padding:18px}.layout{grid-template-columns:minmax(0,1fr) 230px;gap:18px}h1{font-size:28px}}@media(max-width:700px){main{padding:14px}.layout{grid-template-columns:1fr}.subtle{display:none}#canvas-host{aspect-ratio:4/3}aside{padding:8px 4px}h1{font-size:28px}.transport{gap:6px;padding:10px 8px}#reset{display:none}}
</style>
</head>
<body><main>
<header><div class="brand">Four worlds / 3D</div><span class="subtle">Geometry · motion · detail</span></header>
<nav aria-label="Choose a 3D proof"><button data-proof="dna" aria-pressed="true">01 DNA</button><button data-proof="engine" aria-pressed="false">02 Engine</button><button data-proof="gradient" aria-pressed="false">03 Gradient descent</button><button data-proof="minecraft" aria-pressed="false">04 Minecraft</button></nav>
<pre id="error" role="alert" hidden></pre>
<div class="layout"><section class="stage" aria-label="3D visualization"><div id="canvas-host"></div><div class="transport"><button id="play" disabled>Play</button><button id="restart" disabled>Replay</button><input id="seek" aria-label="Animation time" type="range" min="0" max="1" step="0.01" value="0" disabled><span id="clock">0.0 / 0.0 s</span><button id="reset" disabled>Reset view</button></div><div class="orbit-note">Drag model to orbit · Shift-drag to pan · Silent visualization</div></section>
<aside><div id="kicker" class="kicker"></div><h1 id="title"></h1><p id="description"></p><div id="controls"></div><div id="status" role="status">Loading…</div><details><summary>Model & fidelity notes</summary><ul id="notes"></ul><a id="source-link" href="https://www.rcsb.org/structure/1BNA" target="_blank" rel="noreferrer">Atomic structure: RCSB PDB 1BNA ↗</a></details></aside></div>
<footer>Built with animlib · Four independent visualization proofs</footer>
</main><script type="module" src="./proofs/gallery.ts"></script></body>
</html>
