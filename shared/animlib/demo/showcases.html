<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>24 worlds · Production scene showcases</title>
<style>
:root{color-scheme:dark;font:14px system-ui,sans-serif;color:#e6eee8;background:#101310}*{box-sizing:border-box}body{margin:0}main{max-width:1600px;margin:auto;padding:28px}header{display:flex;justify-content:space-between;border-bottom:1px solid #303730;padding-bottom:20px;gap:20px}h1{font-size:27px;line-height:1.2;margin:12px 0}p{color:#a7b7ad;line-height:1.6;font-size:13px}nav{display:flex;align-items:center;gap:12px;margin:20px 0;flex-wrap:wrap}button,select,input{font:inherit;color:inherit;accent-color:#aad6ba}button,select{background:#18221c;border:1px solid #425348;border-radius:5px;padding:9px;max-width:100%}button{cursor:pointer}button:disabled{opacity:.4;cursor:default}:focus-visible{outline:2px solid #aad6ba;outline-offset:3px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:26px}.stage{background:black;border:1px solid #273029;border-radius:8px;overflow:hidden}#canvas-host{aspect-ratio:16/10}canvas{display:block;width:100%;height:100%}.transport{display:flex;align-items:center;gap:8px;padding:12px}#seek{flex:1;min-width:50px}#clock{white-space:nowrap;font-size:11px}.hint{color:#82948a;font-size:11px;padding:0 14px 12px}#overall,#kicker,#playback{color:#9aafa1;font-size:12px}#state{padding:10px;border:1px solid #485e4e;margin:14px 0;white-space:pre-wrap}#state[data-failed=true]{color:#ffb5aa;border-color:#a74d42}details{border-top:1px solid #303730;padding-top:14px;margin-top:18px}summary{cursor:pointer}pre{font:11px/1.5 monospace;white-space:pre-wrap;overflow-wrap:anywhere;color:#abb9af}a{color:#b5d9c1}#evidence{display:flex;flex-wrap:wrap;gap:12px;margin-top:14px}#error{white-space:pre-wrap;color:#ffb5aa}footer{font-size:11px;color:#82948a;margin-top:20px}@media(max-width:850px){main{padding:14px}.layout{grid-template-columns:1fr}#canvas-host{aspect-ratio:4/3}#run{max-width:75vw}}
</style></head><body><main>
<header><strong>24 worlds / Production scene showcases</strong><span id="overall">Loading batch…</span></header>
<nav><label>Topic <select id="run" aria-label="Showcase topic"></select></label><button id="refresh">Refresh results</button></nav>
<div class="layout"><section class="stage"><div id="canvas-host"></div><div class="transport"><button id="play" disabled>Play</button><button id="restart" disabled>Replay</button><input id="seek" type="range" min="0" max="20" step=".01" value="0" aria-label="Animation time" disabled><span id="clock">0 / 20 s</span><button id="reset" disabled>Reset view</button></div><div class="hint">Silent · Drag 3D geometry to orbit · Automatic production verification</div></section>
<aside><div id="kicker"></div><h1 id="title"></h1><div id="state"></div><div id="playback"></div><p id="description"></p><div id="evidence"></div><details><summary>Exact input prompt</summary><pre id="prompt"></pre></details><details><summary>Verification findings</summary><pre id="review"></pre></details><p><a id="source" hidden download="scene.js">Download generated source</a></p><pre id="error" role="alert"></pre></aside></div>
<footer id="boundary"></footer></main><script type="module" src="./showcases.ts"></script></body></html>
