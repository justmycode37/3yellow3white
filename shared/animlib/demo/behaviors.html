<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>animlib canvas behaviors</title>
<style>html,body{margin:0;width:100%;height:100%;background:#000}canvas{display:block;width:100%;height:100%}</style>
<canvas aria-label="Interactive atoms. Drag atoms to stretch the bond; drag background to rotate; Shift-drag to pan."></canvas>
<script type="module">
  import { createPlayer } from '../src/index.ts';
  import { behaviorSource } from './behaviors.ts';
  const player = createPlayer({ canvas: document.querySelector('canvas') });
  const ready = player.submit({ type: 'load', scenes: [behaviorSource] });
  window.animlibDemo = { player, ready };
  const result = await ready;
  if (!result.ok) throw new Error(JSON.stringify(result.diagnostics));
  await player.play();
  window.addEventListener('pagehide', () => player.dispose(), { once: true });
</script>
</html>
