<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Explanatory geometry · animlib</title>
<style>
:root{color-scheme:dark;font:15px/1.6 system-ui;color:#ecebe5;background:#101111}*{box-sizing:border-box}body{margin:0}main{max-width:1300px;margin:auto;padding:32px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #333;padding-bottom:20px}h1{font-size:24px;font-weight:500;margin:0}a{color:#9cdceb}nav{display:flex;gap:12px;margin:24px 0}button{font:inherit;border:1px solid #444;border-radius:6px;padding:8px 16px;color:inherit;background:#191d1b;cursor:pointer}button[aria-pressed=true]{border-color:#9cdceb;color:#9cdceb}.layout{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:28px}canvas{width:100%;height:580px;background:#000;border:1px solid #333;border-radius:12px;touch-action:none}p{color:#a4aaa5}.eyebrow{font:11px ui-monospace;letter-spacing:.1em;color:#8c9990}#controls .animlib-controls{position:static!important;inset:auto!important;width:auto!important;height:auto!important;gap:24px!important}#controls .animlib-control{width:100%!important}#error{color:#fc6255;white-space:pre-wrap}footer{margin-top:20px;display:flex;align-items:center;gap:16px}input[type=range]{flex:1}button:focus-visible{outline:2px solid #9cdceb}@media(max-width:760px){main{padding:16px}.layout{grid-template-columns:1fr}canvas{height:440px}nav{flex-wrap:wrap}header a{display:none}}
</style></head><body><main>
<header><h1>See beneath the surface.</h1><a href="spatial.html">Spatial studies ↗</a></header>
<nav aria-label="Choose study"><button data-index="0" aria-pressed="true">Sections</button><button data-index="1" aria-pressed="false">Scalar fields</button><button data-index="2" aria-pressed="false">Edges & labels</button></nav>
<div class="layout"><section><canvas aria-label="Interactive explanatory geometry. Drag to orbit."></canvas><footer><button id="play">Play</button><input id="seek" aria-label="Timeline" type="range" min="0" max="4" step="0.01" value="0"><button id="reset">Reset view</button></footer></section><aside><div class="eyebrow">EXPLANATORY GEOMETRY</div><h2 id="title"></h2><p id="description"></p><div id="controls"></div><p>Drag to orbit. Each view has its own camera. Controls also work while paused.</p><pre id="error" role="alert"></pre></aside></div>
</main><script type="module">
import {createPlayer} from '../src/index.ts';
import {explanatorySources} from './explanatory.ts';
const $=s=>document.querySelector(s),player=createPlayer({canvas:$('canvas'),controlsRoot:$('#controls')});
const studies=[['A cut reveals a hole.','Move the horizontal plane through the ring. The gold cap preserves the central hole; yellow marks the actual intersection. Compare a cutaway with its top view.'],['Color carries a quantity.','The palette encodes local height on a fixed scale from −1.5 to +1.5. Change amplitude to resample both the shape and its values. A yellow section traces the slice.'],['Reveal the useful edges.','Raise the crease threshold to suppress tessellation edges. Silhouettes follow the camera. Orbit to compare label depth, whole-label hiding, fading, and overlay.']];
let current=0;
function describe(){const [title,description]=studies[current];$('#title').textContent=title;$('#description').textContent=description;for(const b of document.querySelectorAll('[data-index]'))b.setAttribute('aria-pressed',String(+b.dataset.index===current));}
describe();
const ready=player.submit({type:'load',scenes:explanatorySources}).then(r=>{if(!r.ok)throw new Error(JSON.stringify(r.diagnostics));document.body.dataset.ready='true'});
window.animlibDemo={player,ready};
player.subscribe(s=>{if(s.error)$('#error').textContent=s.error;$('#seek').value=String(s.time);$('#play').textContent=s.status==='playing'?'Pause':'Play'});
for(const b of document.querySelectorAll('[data-index]'))b.onclick=async()=>{await ready;current=+b.dataset.index;await player.seek({scene:explanatorySources[current].id,time:0});player.resetView();describe()};
$('#play').onclick=async()=>{await ready;if(player.getState().status==='playing')player.pause();else player.play()};
$('#seek').oninput=async e=>{await ready;await player.seek({scene:explanatorySources[current].id,time:+e.target.value})};
$('#reset').onclick=()=>player.resetView();ready.catch(e=>$('#error').textContent=e.message);
window.addEventListener('pagehide',()=>player.dispose(),{once:true});
</script></body></html>
