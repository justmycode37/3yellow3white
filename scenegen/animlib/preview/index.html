<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>scenegen preview</title>
    <style>
      :root { font-family: ui-sans-serif, system-ui, "Segoe UI", sans-serif; color: #fff; background: #000; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
      main { display: grid; grid-template-rows: auto 1fr auto auto; height: 100%; }
      header { display: flex; gap: 8px; align-items: center; padding: 8px 16px; font-size: 14px; color: #bbb; }
      header button { max-width: 22ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border: 1px solid #555; background: #111; color: #ddd; border-radius: 6px; padding: 4px 10px; cursor: pointer; }
      header button.active { background: #fff; color: #000; }
      #title { margin-left: auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #stage { position: relative; min-height: 0; }
      canvas { display: block; width: 100%; height: 100%; background: #000; outline: none; }
      #captions { min-height: 3.2em; padding: 10px 24px; text-align: center; font-size: 20px; line-height: 1.4; }
      #bar { display: flex; gap: 14px; align-items: center; padding: 8px 20px 16px; }
      #bar button { width: 40px; height: 40px; border: 0; border-radius: 50%; background: #fff; color: #000; cursor: pointer; font-size: 16px; }
      #bar input { flex: 1; accent-color: #fff; }
      #error { color: #fc6255; font-size: 13px; padding: 0 20px; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <main>
      <header><span id="topics"></span><span id="title"></span></header>
      <div id="stage"><canvas id="canvas" tabindex="0"></canvas></div>
      <div id="captions"></div>
      <div>
        <p id="error" hidden></p>
        <div id="bar"><button id="play">▶</button><input id="scrubber" type="range" min="0" max="1" step="0.001" value="0" /></div>
      </div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
