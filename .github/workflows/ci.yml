name: Build and test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/app/package-lock.json
      - name: Validate deployment configuration
        run: |
          bash -n scripts/deploy-release.sh scripts/package-release.sh scripts/smoke-container.sh
          shellcheck scripts/deploy-release.sh scripts/package-release.sh scripts/smoke-container.sh
          python3 scripts/test-container-config.py
          python3 scripts/test-release-stream.py
          python3 scripts/test-cleanup-images.py
      - run: npm ci
      - run: npm ci --prefix frontend/app
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm run typecheck --workspace @aha/backend
      - run: npm run test --workspace @aha/backend
      - run: npm run app:test
      - run: npm run app:build
      - run: npm run demo:build
      - name: Build, test container lifecycle, and package the Docker image
        env:
          DEPLOY_REVISION: ${{ github.sha }}
        run: bash scripts/package-release.sh "$DEPLOY_REVISION" "$RUNNER_TEMP/release"
      - name: Save the tested release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ github.sha }}
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
